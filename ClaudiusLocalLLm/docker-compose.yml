services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: orchestrator
      POSTGRES_DB: orchestrator
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrator"]
      interval: 5s
      timeout: 5s
      retries: 10

  # OpenAI-compatible local inference server -- runs entirely on this machine, no internet
  # required. Drop GGUF/model configs into ./localai-models; see README for setup. Omit this
  # service (and use only `ollama`) if you'd rather run local models that way instead.
  localai:
    image: localai/localai:latest-cpu
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - ./localai-models:/build/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 10s
      retries: 30

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      # Unset by default -- fully local setups never call the anthropic/* model entry, so no key
      # (and no internet access) is required. Set this only if you opt a project into the cloud.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      LOCALAI_BASE_URL: ${LOCALAI_BASE_URL:-http://localai:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      localai:
        condition: service_started

  api:
    build:
      context: .
      dockerfile: src/Orchestrator.Api/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Orchestrator: "Host=postgres;Port=5432;Database=orchestrator;Username=orchestrator;Password=orchestrator"
      ANTHROPIC_BASE_URL: "http://litellm:4000"
      AIDER_OPENAI_API_BASE: "http://litellm:4000"
      # Discord integration -- optional. Set DISCORD_ENABLED=true and DISCORD_BOT_TOKEN (and
      # DISCORD_NOTIFY_CHANNEL_ID) to get notifications when a task needs approval/attention and
      # to enable the "!status" command. See README for bot setup.
      Discord__Enabled: ${DISCORD_ENABLED:-false}
      Discord__BotToken: ${DISCORD_BOT_TOKEN:-}
      Discord__NotifyChannelId: ${DISCORD_NOTIFY_CHANNEL_ID:-0}
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_started
    volumes:
      - ./workspaces:/workspaces

volumes:
  postgres-data:
