name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: Weaver

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Weaver.sln

      - name: Build
        run: dotnet build Weaver.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test tests/Weaver.Tests --no-build --configuration Release --logger "console;verbosity=normal"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Weaver/frontend/package-lock.json

      - name: Install dependencies
        working-directory: Weaver/frontend
        run: npm ci

      - name: Typecheck + build
        working-directory: Weaver/frontend
        run: npm run build
